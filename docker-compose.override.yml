# Sobreposicao de desenvolvimento, aplicada automaticamente pelo docker compose.
#
# Monta o codigo-fonte dentro dos containers para que a API recarregue sozinha e
# para que migracoes geradas por `make revision` aparecam no host. Em producao
# este arquivo nao existe e vale apenas o docker-compose.yml.
services:
  api:
    volumes:
      - ./api:/app
      - ./data:/data:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
